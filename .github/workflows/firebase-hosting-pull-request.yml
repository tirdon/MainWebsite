name: Validate and preview Firebase Hosting
on: pull_request

permissions:
  contents: read

concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate static site and browser modules
        run: bun run check

  preview:
    needs: validate
    # Forks and Dependabot still get validation, without deployment secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy pull request preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THIRADONIUS }}
          projectId: thiradonius
          entryPoint: .
          firebaseToolsVersion: 15.36.0
          expires: 7d
