name: Validate and deploy Firebase Hosting
on:
  push:
    branches:
      - main

permissions:
  contents: read

# Finish an active release before starting the next one.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate static site and browser modules
        run: bun run check
      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THIRADONIUS }}
          channelId: live
          projectId: thiradonius
          entryPoint: .
          firebaseToolsVersion: 15.36.0
